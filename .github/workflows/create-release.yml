name: Create Mod Release

on:
  push:
    tags:
      - "*-v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Extract release metadata
        id: metadata
        run: |
          python scripts/create_release.py "${GITHUB_REF_NAME}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.metadata.outputs.title }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "$TITLE" \
            --notes-file release-notes.md \
            --draft
